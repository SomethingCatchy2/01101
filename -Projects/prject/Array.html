        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: bisque;
        }
        /* Existing H1 outside the tree, if you want to keep it */
        body > h1:first-child {
            text-align: center;
            font-size: 1.8em;
            margin-bottom: 30px;
            color: #333;
        }

        #array-container {
            /* Container for the tree */
        }

        #array-container ul {
            list-style-type: none;
            padding-left: 0; /* Base UL has no padding, children will */
            margin: 0;
        }
        
        .tree-node {
            position: relative;
            padding-left: 25px; /* Space for connector lines */
            margin-top: 2px; /* Small space between nodes */
        }

        .tree-node h1 {
            font-size: 0.9em; /* Smaller for tree view */
            font-weight: bold;
            padding: 4px 8px;
            margin: 0;
            display: inline-block;
            border: 1px solid #a0a0a0;
            border-radius: 4px;
            background-color: #f0f0f0;
            position: relative; /* For z-index to sit above lines */
            z-index: 1;
            color: #333;
        }

        .tree-node > span { /* For primitive values or messages */
            margin-left: 8px;
            font-style: italic;
            color: #444;
            background-color: #fff; /* Ensure it's above lines */
            position: relative;
            z-index: 1;
            padding: 1px 3px;
            border-radius: 3px;
        }
        .tree-node > span.warning-message {
            color: #c09853;
            background-color: #fcf8e3;
            border: 1px solid #fbeed5;
        }
         .tree-node > span.info-message {
            color: #3a87ad;
            background-color: #d9edf7;
            border: 1px solid #bce8f1;
        }


        /* L-shaped connector lines for each node */
        .tree-node::before, .tree-node::after {
            content: '';
            position: absolute;
            left: 0;
            background-color: #a0a0a0;
            z-index: 0;
        }

        /* Vertical part of the L */
        .tree-node::before {
            top: 0;
            width: 1px;
            height: 100%;
        }

        /* Horizontal part of the L */
        .tree-node::after {
            top: 1em; /* Align with middle of H1, adjust if H1 padding/line-height changes */
            width: 15px; /* Length of horizontal line */
            height: 1px;
        }

        /* Root UL doesn't need padding for lines drawn by its children */
        #array-container > ul {
            padding-left: 0;
        }

        /* Root node (the very first li.tree-node) */
        #array-container > ul > .tree-node.tree-root {
            padding-left: 0; /* No indent */
        }
        #array-container > ul > .tree-node.tree-root::before,
        #array-container > ul > .tree-node.tree-root::after {
            display: none; /* No connector lines for the root itself */
        }

        /* Children of the root node need their UL indented */
         #array-container > ul > .tree-node.tree-root > ul {
            padding-left: 25px;
        }


        /* For the first child in any list, its vertical line starts from the horizontal line */
        ul > .tree-node:first-child::before {
            top: 1em; 
            height: calc(100% - 1em);
        }

        /* For the last child in any list, its vertical line ends at its horizontal line */
        ul > .tree-node:last-child::before {
            height: 1em;
        }
        
        /* If a node is the only child, its vertical line is just a stub for the T-junction */
        ul > .tree-node:only-child::before {
            top: 1em;
            height: 1px; /* Effectively makes it part of the horizontal line */
        }

        /* Special message nodes might not need full connectors if they don't have children */
        .tree-node.special-message-node > ul, /* Hide UL if it was accidentally added */
        .tree-node.message-node > ul {
            display: none;
        }
        /* If special/message nodes are guaranteed to be leaves, their vertical line should also be short */
        .tree-node.special-message-node::before,
        .tree-node.message-node::before {
             height: 1em; /* Only if they are treated as last children graphically */
        }
        /* If they are always leaves, they are effectively :last-child in terms of line drawing */
         ul > .tree-node.special-message-node:not(:only-child)::before,
         ul > .tree-node.message-node:not(:only-child)::before {
            /* This ensures that if they are not the only child, but are leaves,
               their vertical line is still short. The :last-child rule handles most of this.
               This might be overly complex if :last-child is sufficient.
            */
         }

// Rendering arrays to the frontend - Updated function
const MAX_RENDER_DEPTH = 12; 
const MAX_ARRAY_ITEMS_DISPLAY = 15; // Reduced for better tree visibility

function renderArray(name, currentElement, parentListElement, depth = 0, visitedObjects = new Set()) {
    const nodeItem = document.createElement('li');
    nodeItem.classList.add('tree-node');
    if (depth === 0) {
        nodeItem.classList.add('tree-root');
    }
    parentListElement.appendChild(nodeItem);

    const title = document.createElement('h1');
    title.textContent = name;
    nodeItem.appendChild(title);

    let messageSpan; // For messages

    if (depth > MAX_RENDER_DEPTH) {
        messageSpan = document.createElement('span');
        messageSpan.classList.add('info-message');
        messageSpan.textContent = "[Max rendering depth reached]";
        nodeItem.appendChild(messageSpan);
        nodeItem.classList.add('message-node'); // Add class for styling leaf message nodes
        return;
    }

    if (currentElement === arrInfiniteRecursion || currentElement === arrThatAddsArrayIntoItself) {
        messageSpan = document.createElement('span');
        messageSpan.classList.add('warning-message');
        messageSpan.textContent = `[Contents not displayed due to self-reference to prevent crash]`;
        nodeItem.appendChild(messageSpan);
        nodeItem.classList.add('special-message-node'); // Add class for styling
        return; 
    }

    if (typeof currentElement === 'object' && currentElement !== null) {
        if (visitedObjects.has(currentElement)) {
            messageSpan = document.createElement('span');
            messageSpan.classList.add('info-message');
            messageSpan.textContent = "[Circular reference detected by visited set]";
            nodeItem.appendChild(messageSpan);
            nodeItem.classList.add('message-node');
            return;
        }
        visitedObjects.add(currentElement);
    }

    if (Array.isArray(currentElement)) {
        if (currentElement.length > 0) {
            const childrenUl = document.createElement('ul');
            nodeItem.appendChild(childrenUl);
            const itemsToDisplay = currentElement.slice(0, MAX_ARRAY_ITEMS_DISPLAY);
            itemsToDisplay.forEach((item, index) => {
                let childName = `Item ${index}`;
                if (Array.isArray(item)) childName = `Child Array at index ${index}`;
                else if (typeof item === 'object' && item !== null && !(item instanceof Date) && !(item instanceof Map) && !(item instanceof Set)) childName = `Object at index ${index}`;
                renderArray(childName, item, childrenUl, depth + 1, visitedObjects);
            });

            if (currentElement.length > MAX_ARRAY_ITEMS_DISPLAY) {
                const moreLi = document.createElement('li');
                moreLi.classList.add('tree-node', 'message-node'); // Style as a leaf message
                const moreSpan = document.createElement('span');
                moreSpan.classList.add('info-message');
                moreSpan.textContent = `... and ${currentElement.length - MAX_ARRAY_ITEMS_DISPLAY} more items.`;
                moreLi.appendChild(moreSpan)
                childrenUl.appendChild(moreLi);
            }
        } else {
             messageSpan = document.createElement('span');
             messageSpan.textContent = "[Empty Array]";
             nodeItem.appendChild(messageSpan);
        }
    } else if (typeof currentElement === 'object' && currentElement !== null && !(currentElement instanceof Date) && !(currentElement instanceof Map) && !(currentElement instanceof Set) && !(typeof currentElement === 'function') && !(typeof currentElement === 'symbol')) {
        const childrenUl = document.createElement('ul');
        let hasKeys = false;
        for (const key in currentElement) {
            if (Object.prototype.hasOwnProperty.call(currentElement, key)) {
                hasKeys = true;
                renderArray(`Property "${key}"`, currentElement[key], childrenUl, depth + 1, visitedObjects);
            }
        }
        if (hasKeys) {
            nodeItem.appendChild(childrenUl);
        } else {
            messageSpan = document.createElement('span');
            messageSpan.textContent = "[Empty Object]";
            nodeItem.appendChild(messageSpan);
        }
    } else {
        // Handle primitives and special object types as leaf values
        const valueSpan = document.createElement('span');
        let displayValue;
        if (typeof currentElement === 'symbol') displayValue = currentElement.toString();
        else if (currentElement instanceof Date) displayValue = `Date: ${currentElement.toISOString()}`;
        else if (currentElement instanceof Map) displayValue = `Map (size ${currentElement.size})`;
        else if (currentElement instanceof Set) displayValue = `Set (size ${currentElement.size})`;
        else if (typeof currentElement === 'function') displayValue = `Function: ${currentElement.name || '(anonymous)'}`;
        else displayValue = String(currentElement);
        
        valueSpan.textContent = `${displayValue.substring(0, 200)}${displayValue.length > 200 ? '...' : ''}`;
        nodeItem.appendChild(valueSpan);
    }
    
    if (typeof currentElement === 'object' && currentElement !== null) {
        visitedObjects.delete(currentElement); 
    }
}
