<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Pa!</title>
    <link rel="stylesheet" href="/-Projects/new_index_helpers/style.css" />
    <script src="/-Projects/esc-to-index.js"></script>
    <link rel="icon" type="image/png" href="/favicon.png">

</head>

<body>
    <h1>Welcome to a list maker for to use!</h1>
    <pre>You can input stuff and it will be saved to <b><i>your browser's local stoage.</i></b> <br>You also can check/uncheck stuff and make items/lists. <i>"Save files" coming soon!</i>
    </pre>

    <!-- Add new item input -->
    <div class="add-item-section">
        <input type="text" class="item-input" id="mainItemInput" placeholder="Enter an item...">

        <button onclick="addItemToSelectedList()" id="addButton">Add to</button>
        <select id="listSelector" onchange="updateButtonText()">
            <option value="newList">New List</option>
            <option value="dinnerList">Supper</option>
            <option value="lunchList">L'nch</option>
            <option value="breakfastList">Breekin'</option>
            <option value="itemsList">Items</option>
        </select>

    </div>

    <!-- Clear All button -->
    <div>
        <button onclick="clearSavedStates()">
            Clear All
        </button>
    </div>

 <br>




    <!-- An AI inclusion to have the states of the check boxes be saved to the local storage. This allows for to acctually
     use this for a shopping list. Planned we are to add the ability to add things needed that also be savin. And
     maybe like something else idk. Like presets of things or something. and also the logic behind the adding and removing items. -->
    <script>
        // Functions for the single input system
        function updateButtonText() {
            const select = document.getElementById('listSelector');
            const button = document.getElementById('addButton');
            const input = document.getElementById('mainItemInput');

            if (select.value === 'newList') {
                button.textContent = 'Create List';
                if (input) input.placeholder = 'Enter new list name...';
            } else {
                const selectedText = select.options[select.selectedIndex]?.text || 'List';
                button.textContent = `Add to ${selectedText}`;
                if (input) input.placeholder = 'Enter an item...';
            }

            // Save the selected list to localStorage
            localStorage.setItem('selectedList', select.value);
        }

        function addItemToSelectedList() {
            const input = document.getElementById('mainItemInput');
            const select = document.getElementById('listSelector');
            const selected = select.value;
            const text = input.value.trim();

            if (!text) {
                alert('Please enter text.');
                return;
            }

            if (selected === 'newList') {
                // Create a new list named by the input text
                const newId = shoppingManager.createNewList(text);
                if (newId) {
                    // Switch selection to the new list
                    const opt = document.createElement('option');
                    opt.value = newId;
                    opt.textContent = text;
                    // insert after the New List option
                    select.insertBefore(opt, select.options[1] || null);
                    select.value = newId;
                    localStorage.setItem('selectedList', newId);
                    updateButtonText();
                }
                input.value = '';
                return;
            }

            // Add item to existing list
            shoppingManager.addItemToList(selected, text);
            input.value = '';
        }

        // Handle Enter key for the main input
        document.addEventListener('DOMContentLoaded', function () {
            const input = document.getElementById('mainItemInput');
            const select = document.getElementById('listSelector');

            // Load saved list selection
            const savedList = localStorage.getItem('selectedList');
            if (savedList) {
                select.value = savedList;
            }

            input.addEventListener('keypress', function (event) {
                if (event.key === 'Enter') {
                    addItemToSelectedList();
                }
            });
            // Set initial button text
            updateButtonText();
        });

        // Modular Shopping List Manager
        class ShoppingListManager {
            constructor() {
                this.defaultConfig = [
                    // { id: 'dinnerList', name: 'Supper' },
                    // { id: 'lunchList', name: "L'nch" },
                    // { id: 'breakfastList', name: "Breekin'" },
                    // { id: 'itemsList', name: 'Items' }
                ];
                this.listConfig = [];
                this.lists = [];
                this.storageKeys = {
                    checkboxes: 'shoppingListCheckboxStates',
                    customItems: 'shoppingListCustomItems',
                    listsConfig: 'shoppingListConfigs'
                };
            }

            // Initialize the entire system
            init() {
                // Load list config and reflect in UI
                this.loadListConfig();
                this.populateListSelector();
                this.renderMissingListSections();

                // Then load data and wire events
                this.loadAllCustomItems();
                this.loadCheckboxStates();
                this.initializeAllCheckboxes();
                this.setupInputHandlers();
                this.attachDeleteListButtons();
            }

            // ---------- List config persistence ----------
            loadListConfig() {
                const saved = localStorage.getItem(this.storageKeys.listsConfig);
                if (!saved) {
                    // Seed from defaults and current DOM headings if present
                    const seeded = this.defaultConfig.map(({ id, name }) => {
                        const titleEl = this._findHeadingForList(id);
                        const domName = titleEl ? titleEl.textContent.trim() : name;
                        return { id, name: domName || name };
                    });
                    this.listConfig = seeded;
                    this.lists = seeded.map(x => x.id);
                    this.saveListConfig();
                    return;
                }

                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        // Ensure defaults exist (use saved name if present)
                        const merged = [];
                        const seen = new Set();
                        this.defaultConfig.forEach(def => {
                            const found = parsed.find(p => p && p.id === def.id && p.name);
                            const name = found ? found.name : def.name;
                            merged.push({ id: def.id, name });
                            seen.add(def.id);
                        });
                        // Append any additional lists from saved config
                        parsed.forEach(p => {
                            if (p && p.id && p.name && !seen.has(p.id)) {
                                merged.push({ id: p.id, name: p.name });
                                seen.add(p.id);
                            }
                        });
                        this.listConfig = merged;
                        this.lists = merged.map(x => x.id);
                        this.saveListConfig();
                        return;
                    }
                } catch (e) {
                    console.warn('Invalid listsConfig in localStorage, resetting to defaults.', e);
                }
                // Fallback to defaults
                this.listConfig = [...this.defaultConfig];
                this.lists = this.listConfig.map(x => x.id);
                this.saveListConfig();
            }

            saveListConfig() {
                const toSave = this.listConfig
                    .filter(x => x && x.id && x.name)
                    .map(x => ({ id: x.id, name: x.name }));
                localStorage.setItem(this.storageKeys.listsConfig, JSON.stringify(toSave));
            }

            populateListSelector() {
                const select = document.getElementById('listSelector');
                if (!select) return;
                const previous = select.value;
                const savedSelection = localStorage.getItem('selectedList');

                // Rebuild options: New List first, then all lists in config
                select.innerHTML = '';
                const newOpt = document.createElement('option');
                newOpt.value = 'newList';
                newOpt.textContent = 'New List';
                select.appendChild(newOpt);
                this.listConfig.forEach(({ id, name }) => {
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = name;
                    select.appendChild(opt);
                });

                // pick selection in priority: saved -> previous -> first non-newList
                const candidates = [savedSelection, previous, this.listConfig[0]?.id];
                let chosen = 'newList';
                for (const c of candidates) {
                    if (c && c !== 'newList' && this.lists.includes(c)) { chosen = c; break; }
                }
                select.value = chosen;
                localStorage.setItem('selectedList', chosen);
                if (typeof updateButtonText === 'function') updateButtonText();
            }

            renderMissingListSections() {
                // Ensure each list in config has DOM nodes; defaults already exist
                this.listConfig.forEach(({ id, name }) => {
                    const listEl = document.getElementById(id);
                    if (!listEl) {
                        this.addNewListSection(id, name);
                    } else {
                        // Update heading text from config (keep your current CSS)
                        const pre = this._findHeadingForList(id);
                        if (pre) pre.textContent = name;
                    }
                });
            }

            _findHeadingForList(listId) {
                const listEl = document.getElementById(listId);
                if (!listEl) return null;
                const hrEl = listEl.previousElementSibling;
                const preEl = hrEl && hrEl.previousElementSibling;
                return (preEl && preEl.tagName === 'PRE') ? preEl : null;
            }

            // Add item to any list (modular function)
            addItemToList(listId, itemText = null) {
                // If itemText is not provided, get it from the input field
                if (!itemText) {
                    const input = document.querySelector(`input[data-list="${listId}"]`);
                    itemText = input.value.trim();
                }

                if (itemText === '') {
                    alert('Please enter an item name!');
                    return;
                }

                // Create new list item with checkbox and delete button
                const newListItem = this.createListItem(itemText, listId);

                // Add to the specified list
                const targetList = document.getElementById(listId);
                targetList.appendChild(newListItem);

                // Save and cleanup
                this.saveCustomItems();
                this.saveCheckboxStates();
            }

            // Create a standardized list item
            createListItem(itemText, listId) {
                const newListItem = document.createElement('li');
                const newCheckbox = document.createElement('input');
                newCheckbox.type = 'checkbox';

                newListItem.appendChild(newCheckbox);
                newListItem.appendChild(document.createTextNode(itemText));

                // Add delete button for custom items
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = ' (remove item)';
                deleteBtn.style.marginLeft = '10px';
                deleteBtn.style.background = 'none';
                deleteBtn.style.border = 'none';
                deleteBtn.style.cursor = 'pointer';
                deleteBtn.style.fontSize = '12px';
                deleteBtn.onclick = () => this.removeCustomItem(newListItem, listId);
                newListItem.appendChild(deleteBtn);

                // Add event listener to checkbox
                newCheckbox.addEventListener('change', () => this.saveCheckboxStates());

                return newListItem;
            }

            // Remove custom item from any list
            removeCustomItem(listItem, listId) {
                listItem.remove();
                this.saveCustomItems();
                this.saveCheckboxStates();
            }

            // Save all custom items from all lists
            saveCustomItems() {
                const allCustomItems = {};

                this.lists.forEach(listId => {
                    const customItems = [];
                    const list = document.getElementById(listId);
                    const listItems = list.querySelectorAll('li');

                    listItems.forEach(li => {
                        const deleteBtn = li.querySelector('button');
                        if (deleteBtn) { // Only save items with delete buttons (custom items)
                            const text = li.childNodes[1].textContent;
                            customItems.push(text);
                        }
                    });

                    allCustomItems[listId] = customItems;
                });

                localStorage.setItem(this.storageKeys.customItems, JSON.stringify(allCustomItems));
            }

            // Load custom items for all lists
            loadAllCustomItems() {
                const savedItems = localStorage.getItem(this.storageKeys.customItems);
                if (savedItems) {
                    const allCustomItems = JSON.parse(savedItems);

                    this.lists.forEach(listId => {
                        if (allCustomItems[listId]) {
                            this.loadCustomItemsForList(listId, allCustomItems[listId]);
                        }
                    });
                }
            }

            // Load custom items for a specific list
            loadCustomItemsForList(listId, customItems) {
                const list = document.getElementById(listId);

                // Clear existing custom items
                const existingCustomItems = list.querySelectorAll('li button');
                existingCustomItems.forEach(btn => {
                    btn.parentElement.remove();
                });

                // Add saved custom items
                customItems.forEach(itemText => {
                    const newListItem = this.createListItem(itemText, listId);
                    list.appendChild(newListItem);
                });
            }

            // Save checkbox states for all lists
            saveCheckboxStates() {
                const checkboxes = document.querySelectorAll('input[type="checkbox"]');
                const checkboxStates = {};

                checkboxes.forEach((checkbox, index) => {
                    const listItem = checkbox.parentElement;
                    const itemText = listItem.textContent.trim();
                    const listId = listItem.parentElement.id;
                    const key = `${listId}_${index}_${itemText.substring(0, 20)}`;
                    checkboxStates[key] = checkbox.checked;
                });

                localStorage.setItem(this.storageKeys.checkboxes, JSON.stringify(checkboxStates));
            }

            // Load checkbox states for all lists
            loadCheckboxStates() {
                const savedStates = localStorage.getItem(this.storageKeys.checkboxes);
                if (savedStates) {
                    const checkboxStates = JSON.parse(savedStates);
                    const checkboxes = document.querySelectorAll('input[type="checkbox"]');

                    checkboxes.forEach((checkbox, index) => {
                        const listItem = checkbox.parentElement;
                        const itemText = listItem.textContent.trim();
                        const listId = listItem.parentElement.id;
                        const key = `${listId}_${index}_${itemText.substring(0, 20)}`;

                        if (checkboxStates.hasOwnProperty(key)) {
                            checkbox.checked = checkboxStates[key];
                        }
                    });
                }
            }

            // Initialize all checkboxes with event listeners
            initializeAllCheckboxes() {
                const checkboxes = document.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(checkbox => {
                    checkbox.addEventListener('change', () => this.saveCheckboxStates());
                });
            }

            // Setup input handlers for Enter key
            setupInputHandlers() {
                const inputs = document.querySelectorAll('.item-input');
                inputs.forEach(input => {
                    input.addEventListener('keypress', (event) => {
                        if (event.key === 'Enter') {
                            const listId = input.getAttribute('data-list');
                            this.addItemToList(listId);
                        }
                    });
                });
            }

            // Clear all saved states
            clearAllSavedStates() {
                localStorage.removeItem(this.storageKeys.checkboxes);
                localStorage.removeItem(this.storageKeys.customItems);
                localStorage.removeItem('selectedList');

                const checkboxes = document.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(checkbox => {
                    checkbox.checked = false;
                });

                // Remove all custom items
                this.lists.forEach(listId => {
                    const list = document.getElementById(listId);
                    if (list) {
                        const customItems = list.querySelectorAll('li button');
                        customItems.forEach(btn => {
                            btn.parentElement.remove();
                        });
                    }
                });
            }

            // -------- List deletion UI and logic --------
            attachDeleteListButtons() {
                this.lists.forEach(id => this.ensureDeleteButtonOnHeading(id));
            }

            ensureDeleteButtonOnHeading(listId) {
                const listEl = document.getElementById(listId);
                if (!listEl) return;
                // Structure is: <pre>Title</pre><hr><ol id=listId>
                const hrEl = listEl.previousElementSibling;
                const preEl = hrEl && hrEl.previousElementSibling && hrEl.previousElementSibling.tagName === 'PRE'
                    ? hrEl.previousElementSibling
                    : (hrEl && hrEl.previousElementSibling);
                const heading = (preEl && preEl.tagName === 'PRE') ? preEl : null;
                if (!heading) return;

                // Avoid duplicate button
                if (heading.querySelector('button[data-role="delete-list"]')) return;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.setAttribute('data-role', 'delete-list');
                btn.textContent = ' (delete list)';
                btn.style.marginLeft = '10px';
                btn.style.background = 'none';
                btn.style.border = 'none';
                btn.style.cursor = 'pointer';
                btn.style.fontSize = '12px';
                btn.addEventListener('click', () => this.deleteList(listId));
                heading.appendChild(btn);
            }

            deleteList(listId) {
                if (!listId) return;
                const listEl = document.getElementById(listId);
                if (!listEl) return;

                const hrEl = listEl.previousElementSibling;
                const preEl = hrEl && hrEl.previousElementSibling;

                const listName = (preEl && preEl.tagName === 'PRE') ? preEl.textContent.trim() : listId;
                const ok = window.confirm(`Delete the list "${listName}" and all its items?`);
                if (!ok) return;

                // Remove DOM
                listEl.remove();
                if (hrEl && hrEl.tagName === 'HR') hrEl.remove();
                if (preEl && preEl.tagName === 'PRE') preEl.remove();

                // Update internal list registry
                this.lists = this.lists.filter(id => id !== listId);
                this.listConfig = this.listConfig.filter(x => x.id !== listId);
                this.saveListConfig();

                // Update dropdown selector
                const select = document.getElementById('listSelector');
                if (select) {
                    const opt = select.querySelector(`option[value="${listId}"]`);
                    if (opt) opt.remove();

                    // If the deleted list was selected, pick the first remaining option
                    if (select.value === listId) {
                        const first = select.options[0]?.value || '';
                        if (first) {
                            select.value = first;
                            localStorage.setItem('selectedList', first);
                        } else {
                            localStorage.removeItem('selectedList');
                        }
                        if (typeof updateButtonText === 'function') updateButtonText();
                    }
                }

                // Remove custom items for this list from storage
                try {
                    const raw = localStorage.getItem(this.storageKeys.customItems);
                    if (raw) {
                        const obj = JSON.parse(raw);
                        if (obj && typeof obj === 'object') {
                            delete obj[listId];
                            localStorage.setItem(this.storageKeys.customItems, JSON.stringify(obj));
                        }
                    }
                } catch {}

                // Recompute checkbox states from remaining DOM
                this.saveCheckboxStates();
            }

            // Add a new list section (for future expansion)
            addNewListSection(listId, listTitle) {
                const body = document.body;

                // Create title
                const title = document.createElement('pre');
                title.textContent = listTitle;

                // Create hr
                const hr = document.createElement('hr');

                // Create list container
                const ol = document.createElement('ol');
                ol.id = listId;

                // Prefer inserting before the last script that is actually inside <body>
                const bodyScripts = document.body ? document.body.getElementsByTagName('script') : [];
                const anchor = bodyScripts.length ? bodyScripts[bodyScripts.length - 1] : null;

                if (anchor && anchor.parentNode === body) {
                    body.insertBefore(title, anchor);
                    body.insertBefore(hr, anchor);
                    body.insertBefore(ol, anchor);
                } else {
                    // Fallback: append to end of body
                    body.appendChild(title);
                    body.appendChild(hr);
                    body.appendChild(ol);
                }

                // Add to lists and attach delete button
                if (!this.lists.includes(listId)) this.lists.push(listId);
                this.ensureDeleteButtonOnHeading(listId);
            }

            generateListIdFromName(name) {
                const base = (name || 'list')
                    .toLowerCase()
                    .trim()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/(^-|-$)/g, '') || 'list';

                let id = `${base}List`;
                let c = 2;
                while (this.lists.includes(id)) {
                    id = `${base}List${c++}`;
                }
                return id;
            }

            createNewList(name) {
                const trimmed = (name || '').trim();
                if (!trimmed) return null;
                const id = this.generateListIdFromName(trimmed);
                this.addNewListSection(id, trimmed);

                // Update list config and persist
                this.listConfig.push({ id, name: trimmed });
                this.lists = this.listConfig.map(x => x.id);
                this.saveListConfig();

                // Persist an empty item set for the new list to localStorage
                try {
                    const raw = localStorage.getItem(this.storageKeys.customItems);
                    const obj = raw ? JSON.parse(raw) : {};
                    obj[id] = obj[id] || [];
                    localStorage.setItem(this.storageKeys.customItems, JSON.stringify(obj));
                } catch {}

                return id;
            }
        }

        // Global instance
        let shoppingManager;

        // Global functions for backward compatibility and easy access
        function addItemToList(listId) {
            shoppingManager.addItemToList(listId);
        }

        function clearSavedStates() {
            shoppingManager.clearAllSavedStates();
        }

        // Add new list programmatically (for future use)
        function addNewList(listId, listTitle, placeholder) {
            shoppingManager.addNewListSection(listId, listTitle, placeholder);
        }

        // Initialize when the page loads
        document.addEventListener('DOMContentLoaded', function () {
            shoppingManager = new ShoppingListManager();
            shoppingManager.init();
        });
    </script>


</body>
