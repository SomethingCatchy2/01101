<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower of Gable</title>
    <link rel="stylesheet" href="../new_index_helpers/style.css">
    <!-- <script src="../esc-to-index.js"></script> -->
    <a href="../../index.html" style="background-color: darkolivegreen; color: white;">Index</a>
    <style>
        button {
            margin: 1px;
            cursor: pointer;
            color: black;
        }
        p {
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>

<body>
    <hr>
    
    <p>Current Roll: <span id="firstDice">x</span>, <span id="secondDice">y</span>, <span id="thirdDice">z</span>, <span id="forthDice">α</span></p>
    <p>Total: <span id="total">β</span> | Balance: $<span id="balance">γ</span></p>

    <button onclick="rollDice()" id="roll">Roll the dice</button> <!-- gable button -->


    <script>
        // points and bonus points vars
        let totalBeforeBonus = 0;
        let total = 0 ;
        let bonusPoints = 0;
        // money.
        let money = 0;
        // dice roll vars
        let diceRollOne = 0;
        let diceRollTwo = 0;
        let diceRollThree = 0;
        let diceRollFour = 0;
        function rollDice() {
            // Source for the random - https://stackoverflow.com/a/1527834 - Posted by Darin Dimitrov - Retrieved 2026-08-23, License - CC BY-SA 2.5
            
            
            diceRollOne = Math.floor(Math.random() * (6 - 1 + 1)) + 1;
            document.getElementById("firstDice").innerHTML = diceRollOne.toString();
            diceRollTwo = Math.floor(Math.random() * (6 - 1 + 1)) + 1;
            document.getElementById("secondDice").innerHTML = diceRollTwo.toString();
            diceRollThree = Math.floor(Math.random() * (6 - 1 + 1)) + 1;
            document.getElementById("thirdDice").innerHTML = diceRollThree.toString();
            diceRollFour = Math.floor(Math.random() * (6 - 1 + 1)) + 1;
            document.getElementById("forthDice").innerHTML = diceRollFour.toString();
            
            // Add all the points
            totalBeforeBonus = diceRollOne + diceRollTwo + diceRollThree + diceRollFour;
            // TODO put bonus point logic here. Probably use another function so this one doesn't get to anyying to look at
            bonusPoints = 0;
            // place holder bonus points calculation
            total = totalBeforeBonus + bonusPoints;
            
            // very scientific money calculations.
            if (total == 24){
                money += 8793;
            } else {
                money -= 5;
            }
            // log and update stuff
            console.log(diceRollOne, diceRollTwo, diceRollThree, diceRollFour, "|", total);
            document.getElementById("total").innerHTML = total.toString();
            document.getElementById("balance").innerHTML = money.toString();
        }
    </script>

</body>

</html>
